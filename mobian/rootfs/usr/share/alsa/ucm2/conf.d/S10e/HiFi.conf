# Galaxy S10e: ABOX UAIF1 -> two CS35L40 amps, TDM slot 0 = earpiece amp
# (top speaker, "RCV"), slot 1 = loudspeaker amp (bottom, "SPK"), as stock
# dual-speaker. Stock analog gain 17 (17.5 dB); digital a few dB under stock
# 817 because the speaker-protection DSP firmware is not loaded.

SectionVerb {
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	EnableSequence [
		cset "name='SPK PCM Source' ASP"
		cset "name='RCV PCM Source' ASP"
		cset "name='SPK Analog PCM Volume' 17"
		cset "name='RCV Analog PCM Volume' 17"
		cset "name='SPK Digital PCM Volume' 769"
		cset "name='RCV Digital PCM Volume' 761"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},1"
		PlaybackChannels 2
	}
}

# ABOX UAIF0 <- codec AIF1. Bottom mic (DMIC1 on IN3L) on the left channel,
# top mic (DMIC2 on IN4L) on the right, straight into AIF1TX1/2: stock goes
# through LHPF/ASRC/ISRC only because its AIF1 runs on ASYNCCLK. OSR, HPF and
# the 0 dB digital gain are the stock defaults.
SectionDevice."Mic" {
	Comment "Internal Microphones"

	EnableSequence [
		cset "name='IN3 OSR' 3.072MHz"
		cset "name='IN4 OSR' 3.072MHz"
		cset "name='IN3L HPF Switch' 1"
		cset "name='IN4L HPF Switch' 1"
		cset "name='IN3L Digital Volume' 176"
		cset "name='IN4L Digital Volume' 176"
		cset "name='Main Mic Switch' 1"
		cset "name='Sub Mic Switch' 1"
		cset "name='AIF1TX1 Input 1' IN3L"
		cset "name='AIF1TX2 Input 1' IN4L"
	]

	DisableSequence [
		cset "name='AIF1TX1 Input 1' None"
		cset "name='AIF1TX2 Input 1' None"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},0"
		CaptureChannels 2
	}
}
