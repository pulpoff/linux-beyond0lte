# libcamera software ISP on the GPU (the default; set here so it is visible). The camera app streams 1080p on all
# four sensors; a FULL-SIZE stream (cam without --stream, 20 MP+) through it hung the SoC. The CPU path crops instead
# of scaling (a fixed 2.4x zoom on the main camera).
LIBCAMERA_SOFTISP_MODE=gpu
