# cross build for the phones: clang against an arm64 Debian sid sysroot (mmdebstrap, see README)
[constants]
sysroot = '/path/to/arm64-sysroot'
[binaries]
c = ['clang', '--target=aarch64-linux-gnu', '--sysroot=' + sysroot]
pkg-config = 'pkg-config'
strip = 'llvm-strip'
[built-in options]
c_link_args = ['-fuse-ld=lld']
pkg_config_path = ''
[properties]
sys_root = sysroot
pkg_config_libdir = [sysroot + '/usr/lib/aarch64-linux-gnu/pkgconfig', sysroot + '/usr/share/pkgconfig']
[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
