# Galaxy S10e: ABOX/CS35L40 speaker PCM only does S32_LE. Overrides the
# S16LE that the POCO-derived qcom rules (50-qcom-phone-tweaks, 51-qcom)
# force on every ALSA node.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.platform-sound.*" }
      { node.name = "~alsa_input.platform-sound.*" }
    ]
    actions = {
      update-props = {
        audio.format = "S32LE"
      }
    }
  }
]
