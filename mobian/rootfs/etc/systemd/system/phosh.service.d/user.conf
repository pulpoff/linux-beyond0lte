[Service]
User=user
# S10e: gmobile has no panel for samsung,beyond0lte and no file override, so
# GLib serves its display-panels/ resource dir from /etc/gmobile/display-panels
# (G_RESOURCE_OVERLAYS); the camera hole is top right.
Environment=G_RESOURCE_OVERLAYS=/mobi/phosh/gmobile/devices/display-panels=/etc/gmobile/display-panels
TimeoutStopSec=10s
